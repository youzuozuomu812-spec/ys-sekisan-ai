<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142630"><link rel="manifest" href="manifest.json">
<title>Ys'積算AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#17232b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
header{background:#142630;color:white;padding:28px 22px 24px}header h1{margin:0;font-size:30px}header p{margin:8px 0 0;color:#c8d0d4}
main{max-width:850px;margin:auto;padding:14px}.card{background:white;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
h2{font-size:24px;margin:0 0 18px}.label{font-weight:700;color:#64717a;margin:15px 0 7px}
select,input{width:100%;font-size:20px;padding:15px 16px;border:2px solid #d7dde1;border-radius:14px;background:white;color:#17232b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.unit{display:flex;align-items:center;gap:8px}.unit input{flex:1}.unit span{font-weight:700;color:#65717a;min-width:48px}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:800;background:#1d7a43;color:white;margin-top:16px}
.result{background:#142630;color:white;border-radius:18px;padding:20px;margin-top:14px}.big{font-size:34px;font-weight:900;margin:8px 0}.muted{color:#bfc9ce;font-size:14px}
.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff22}.line:last-child{border-bottom:0}.note{font-size:14px;color:#68757d;margin-top:8px;line-height:1.5}
@media(max-width:560px){.row{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body>
<header><h1>Ys'積算AI</h1><p>建設業向け・積算 / 見積 / 粗利管理</p></header><main>
<section class="card"><h2>① 工事種類</h2><div class="label">工事を選択</div>
<select id="type"><option value="normal">掘削・路盤・舗装</option><option value="uneven">不陸舗装</option><option value="porous">透水性舗装</option><option value="concrete">土間コンクリート</option></select>
<div class="note" id="typeNote"></div></section>
<section class="card"><h2>② 工事条件</h2>
<div class="label">舗装面積</div><div class="unit"><input id="area" type="number" inputmode="decimal" value="130"><span>㎡</span></div>
<div class="row"><div><div class="label">掘削深さ</div><div class="unit"><input id="exc" type="number" value="25"><span>cm</span></div></div>
<div><div class="label">路盤厚</div><div class="unit"><input id="base" type="number" value="20"><span>cm</span></div></div></div>
<div class="row"><div><div class="label">舗装厚</div><div class="unit"><input id="pave" type="number" value="5"><span>cm</span></div></div>
<div><div class="label">地先ブロック</div><div class="unit"><input id="block" type="number" value="25"><span>m</span></div></div></div></section>
<section class="card"><h2>③ 登録単価</h2>
<div class="row"><div><div class="label">掘削・積込み</div><div class="unit"><input id="excRate" type="number" value="1800"><span>円/㎥</span></div></div>
<div><div class="label">路盤工</div><div class="unit"><input id="baseRate" type="number" value="1800"><span>円/㎡</span></div></div></div>
<div class="row"><div><div class="label">舗装工（通常）</div><div class="unit"><input id="paveRate" type="number" value="4600"><span>円/㎡</span></div></div>
<div><div class="label">地先ブロック</div><div class="unit"><input id="blockRate" type="number" value="2500"><span>円/m</span></div></div></div>
<div class="row"><div><div class="label">処分費</div><div class="unit"><input id="disposalRate" type="number" value="1800"><span>円/㎥</span></div></div>
<div><div class="label">諸経費率</div><div class="unit"><input id="overhead" type="number" value="10"><span>%</span></div></div></div>
<button id="calc">自動計算する</button></section>
<section class="card"><h2>④ 積算結果</h2><div class="result"><div class="muted">概算見積（税込・諸経費込み）</div><div class="big" id="total">¥0</div><div id="breakdown"></div></div>
<div class="note">入力を変更すると自動再計算。150㎡以上の不陸舗装・透水性舗装は4,300円/㎡を適用。</div></section>
</main>
<script>
const $=id=>document.getElementById(id), n=id=>parseFloat($(id).value)||0, yen=x=>"¥"+Math.round(x).toLocaleString("ja-JP");
function calc(){
 let a=n("area"),exc=n("exc")/100,br=n("base"),ty=$("type").value;
 let er=n("excRate"),rr=n("baseRate"),pr=n("paveRate"),kr=n("blockRate"),dr=n("disposalRate"),oh=n("overhead")/100;
 let rate=pr;
 if(ty==="uneven")rate=a>=150?4300:4600;
 if(ty==="porous")rate=a>=150?4300:4800;
 if(ty==="concrete")rate=0;
 let vol=a*exc, e=vol*er,d=vol*dr,r=a*rr,p=a*rate,k=n("block")*kr,sub=e+d+r+p+k,o=sub*oh,total=sub+o;
 $("total").textContent=yen(total);
 $("breakdown").innerHTML=[["掘削・積込み",e],["残土処分",d],["路盤工",r],["舗装工",p],["地先ブロック",k],["諸経費",o]].map(x=>`<div class="line"><span>${x[0]}</span><strong>${yen(x[1])}</strong></div>`).join("");
 $("typeNote").textContent=ty==="uneven"?"不陸舗装：4,600円/㎡、150㎡以上は4,300円/㎡。":ty==="porous"?"透水性舗装：4,800円/㎡、150㎡以上は4,300円/㎡。":"選択した工事の登録単価を使用します。";
}
document.querySelectorAll("input,select").forEach(x=>{x.addEventListener("input",calc);x.addEventListener("change",calc)});$("calc").onclick=calc;calc();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
